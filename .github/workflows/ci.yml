name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Smoke-test installer entrypoints
        shell: bash
        run: |
          sh -n install-native install-docker
          ./install-native --dry-run
          ./install-docker --dry-run
      - name: Check installer shell quality
        if: runner.os == 'Linux'
        run: shellcheck install-native install-docker scripts/test-docker-install.sh
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build ./cmd/...

  formatting-and-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose config --quiet
      - name: Install, bootstrap, and rerun a real isolated Docker stack
        timeout-minutes: 15
        run: sh scripts/test-docker-install.sh
