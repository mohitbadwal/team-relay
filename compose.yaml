name: team-relay

services:
  state:
    image: ${TEAM_RELAY_STATE_IMAGE:-valkey/valkey:8-alpine}
    command: ${TEAM_RELAY_STATE_COMMAND:-valkey-server --appendonly yes}
    restart: unless-stopped
    volumes:
      - relay-state:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping >/dev/null 2>&1 || redis-cli ping >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TEAM_RELAY_IMAGE:-team-relay:local}
    user: ${TEAM_RELAY_UID:-1000}:${TEAM_RELAY_GID:-1000}
    restart: unless-stopped
    environment:
      REDIS_URL: redis://state:6379/0
      TEAM_RELAY_ADDR: 0.0.0.0:8080
      TEAM_RELAY_HEALTH_URL: http://127.0.0.1:8080/health/ready
      TEAM_RELAY_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    secrets:
      - bootstrap_token
    ports:
      - 127.0.0.1:${TEAM_RELAY_PORT:-8080}:8080
    depends_on:
      state:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/team-relay-server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # A Docker-only operator can run administrative commands with:
  # docker compose run --rm --no-deps admin <command>
  admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TEAM_RELAY_IMAGE:-team-relay:local}
    user: ${TEAM_RELAY_UID:-1000}:${TEAM_RELAY_GID:-1000}
    entrypoint: ["/team-relay-admin"]
    environment:
      # Scoped exception for cleartext traffic on this Compose-only internal
      # network. It does not permit any other host.
      TEAM_RELAY_ALLOW_HTTP_HOST: relay
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

secrets:
  bootstrap_token:
    file: ./secrets/bootstrap-token

volumes:
  relay-state:

networks:
  backend:
    internal: true
